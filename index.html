<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="一款以高中三年生活为目标的女高养成模拟器原型。">
  <title>女高模拟器</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="wrap">

  <section id="setup">
    <div class="card">
      <h1>女高模拟器</h1>
      <h2>先给她起个名字</h2>
      <input id="playerName" type="text" maxlength="12" placeholder="输入名字" class="name-input">

      <h2>本局抽到的10个特质（请选择3个）</h2>
      <div id="traitPool" class="rollgrid"></div>

      <div class="points">可分配点数：<b id="remain">40</b> / 40</div>
      <div class="inputs">
        <label>魅力<input id="iCharm" type="number" min="0" max="40" value="10"></label>
        <label>智力<input id="iIntel" type="number" min="0" max="40" value="10"></label>
        <label>健康<input id="iHealth" type="number" min="0" max="40" value="10"></label>
        <label>家境<input id="iMoney" type="number" min="0" max="40" value="10"></label>
      </div>

      <div class="section-gap">
        <h2>生日</h2>
        <div class="inputs birthday-inputs">
          <label>月份<input id="birthdayMonth" type="number" min="1" max="12" value="1"></label>
          <label>日期<input id="birthdayDay" type="number" min="1" max="31" value="1"></label>
        </div>
      </div>

      <div class="section-gap">
        <button class="primary full-width" onclick="startGame()">开始高中生活</button>
      </div>
    </div>
  </section>

  <section id="game" class="hidden">
    <div class="head">
      <div><h1>女高模拟器</h1><div class="muted">「<span id="playerNameLabel"></span>」</div></div>
      <div class="month" id="monthLabel"></div>
    </div>

    <div class="card">
      <div class="stats">
        <div class="stat"><small>魅力</small><b id="charm">0</b></div>
        <div class="stat"><small>智力</small><b id="intel">0</b></div>
        <div class="stat"><small>健康</small><b id="health">0</b></div>
        <div class="stat"><small>家境</small><b id="money">0</b></div>
      </div>
      <div class="smalltitle">特质 / 兴趣</div>
      <div class="buffs" id="buffs"></div>
    </div>

    <div class="grid">
      <div class="card">
        <h2 id="sectionTitle">本月事件</h2>
        <div class="scene">
          <div class="tag" id="tag"></div>
          <h3 id="title"></h3>
          <p id="text"></p>
        </div>
        <div class="choices" id="choices"></div>
      </div>

      <div>
        <div class="card">
          <h2>高中生活记录</h2>
          <div class="log" id="log"></div>
          <div class="smalltitle">认识的人</div>
          <div id="npcList" class="npc-grid npc-list"></div>
        </div>
      </div>
    </div>
  </section>

  <section id="result" class="hidden">
    <div class="card">
      <h1>女高模拟器</h1>
      <h2 class="result-title">高一结束</h2>
      <div id="resultText" class="result-text"></div>
      <button class="primary full-width result-restart" onclick="location.reload()">重新开始 · 再Roll一次</button>
    </div>
  </section>

  <noscript>这个游戏需要启用 JavaScript 才能运行。</noscript>
</div>

<!--
  这是无构建工具的原生 JavaScript 项目。脚本顺序就是依赖顺序：
  基础数据 -> 状态和界面 -> 事件数据 -> 游戏流程 -> 初始化。
-->
<script src="./src/data/traits.js"></script>
<script src="./src/data/npcs.js"></script>
<script src="./src/data/trait-choices.js"></script>
<script src="./src/core/state.js"></script>
<script src="./src/core/check-system.js"></script>
<script src="./src/core/trait-system.js"></script>
<script src="./src/core/ui.js"></script>
<script src="./src/data/events-year1.js"></script>
<script src="./src/data/routes.js"></script>
<script src="./src/data/random-events.js"></script>
<script src="./src/data/exams.js"></script>
<script src="./src/data/events-year2.js"></script>
<script src="./src/core/game.js"></script>
<script src="./src/main.js"></script>
</body>
</html>
