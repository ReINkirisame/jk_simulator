<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>女高模拟器</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f2ee;color:#403c38;font-family:"Microsoft YaHei","PingFang SC",sans-serif}
.wrap{max-width:940px;margin:auto;padding:28px 18px 60px}
.card{background:#fff;border:1px solid #e4ddd5;border-radius:12px;padding:20px;margin-top:15px}
h1{margin:0;font-size:30px;letter-spacing:4px;font-weight:600}
h2{font-size:17px;margin:0 0 14px}
.muted{font-size:12px;color:#958c83;margin-top:7px}
.notice{font-size:12px;color:#7f766d;line-height:1.8}
.hidden{display:none!important}
.head{border-bottom:1px solid #ddd5cc;padding-bottom:15px;display:flex;justify-content:space-between;align-items:end}
.month{font-size:14px;color:#756d65}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.stat{border:1px solid #e7e0d8;border-radius:8px;padding:12px}
.stat small{display:block;color:#978e85}.stat b{font-size:23px;display:block;margin-top:4px}
.smalltitle{font-size:12px;color:#8d847b;margin-top:15px}
.buffs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.buff{padding:6px 11px;background:#eee8e1;border-radius:15px;font-size:12px}
.grid{display:grid;grid-template-columns:1.18fr .82fr;gap:15px}
.scene{background:#faf8f5;border-radius:8px;padding:16px;min-height:205px}
.tag{font-size:11px;color:#a18d78}
.scene h3{margin:8px 0;font-size:19px}
.scene p{font-size:13px;line-height:1.9;margin:0;color:#655f59;white-space:pre-line}
.choices{display:grid;gap:9px;margin-top:12px}
button{font-family:inherit;font-size:13px;border:1px solid #d8d0c7;background:#fff;color:#45413d;border-radius:7px;padding:11px 13px;cursor:pointer;text-align:left}
button:hover{background:#f6f1eb}
.primary{background:#4d4945;color:#fff;border-color:#4d4945;text-align:center}
.primary:hover{background:#3d3935}
button:disabled{opacity:.45;cursor:not-allowed}
.log{height:350px;overflow:auto;background:#faf8f5;border-radius:7px;padding:11px;font-size:12px;line-height:1.7}
.log p{margin:0 0 7px}
.rollgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.trait{border:1px solid #ddd5cc;border-radius:8px;padding:12px;cursor:pointer;background:#fff}
.trait.selected{border-color:#5a554f;background:#f1ece6}
.trait b{font-size:14px}.trait span{display:block;font-size:11px;color:#8b827a;margin-top:4px}
.points{font-size:14px;margin:12px 0}.inputs{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.inputs label{font-size:12px;color:#7f766d}.inputs input{width:100%;margin-top:5px;padding:9px;border:1px solid #ddd5cc;border-radius:6px;font-size:16px}
.npc-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.npc{border:1px solid #e5ddd5;border-radius:8px;padding:11px;background:#faf8f5}
.npc b{font-size:13px}.npc span{display:block;font-size:11px;color:#827970;margin-top:4px;line-height:1.6}
@media(max-width:680px){.grid{grid-template-columns:1fr}.stats,.inputs{grid-template-columns:repeat(2,1fr)}.rollgrid,.npc-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">

<section id="setup">
  <div class="card">
    <h1>女高模拟器</h1>
    <h2>先给她起个名字</h2>
    <input id="playerName" type="text" maxlength="12" placeholder="输入名字" style="width:100%;padding:10px;border:1px solid #ddd5cc;border-radius:6px;font-size:14px;margin-bottom:16px">

    <h2>本局抽到的10个特质</h2>
    <div id="traitPool" class="rollgrid"></div>

    <div class="points">可分配点数：<b id="remain">40</b> / 40</div>
    <div class="inputs">
      <label>魅力<input id="iCharm" type="number" min="0" max="40" value="10"></label>
      <label>智力<input id="iIntel" type="number" min="0" max="40" value="10"></label>
      <label>健康<input id="iHealth" type="number" min="0" max="40" value="10"></label>
      <label>家境<input id="iMoney" type="number" min="0" max="40" value="10"></label>
    </div>

    <div style="margin-top:14px">
      <button class="primary" style="width:100%;text-align:center" onclick="startGame()">开始高中生活</button>
    </div>
  </div>
</section>

<section id="game" class="hidden">
  <div class="head">
    <div><h1>女高模拟器</h1><div class="muted">「<span id="playerNameLabel"></span>」</div></div>
    <div class="month" id="monthLabel"></div>
  </div>

  <div class="card">
    <div class="stats">
      <div class="stat"><small>魅力</small><b id="charm">0</b></div>
      <div class="stat"><small>智力</small><b id="intel">0</b></div>
      <div class="stat"><small>健康</small><b id="health">0</b></div>
      <div class="stat"><small>家境</small><b id="money">0</b></div>
    </div>
    <div class="smalltitle">特质 / 兴趣</div>
    <div class="buffs" id="buffs"></div>
  </div>

  <div class="grid">
    <div class="card">
      <h2 id="sectionTitle">本月事件</h2>
      <div class="scene">
        <div class="tag" id="tag"></div>
        <h3 id="title"></h3>
        <p id="text"></p>
      </div>
      <div class="choices" id="choices"></div>
    </div>

    <div>
      <div class="card">
        <h2>高中生活记录</h2>
        <div class="log" id="log"></div>
        <div class="smalltitle">认识的人</div>
        <div id="npcList" class="npc-grid" style="margin-top:8px"></div>
      </div>
    </div>
  </div>
</section>

<section id="result" class="hidden">
  <div class="card">
    <h1>女高模拟器</h1>
    <h2 style="margin-top:20px">高一结束</h2>
    <div id="resultText" style="font-size:14px;line-height:2"></div>
    <button class="primary" style="width:100%;text-align:center;margin-top:14px" onclick="location.reload()">重新开始 · 再Roll一次</button>
  </div>
</section>

</div>

<script>
"use strict";
const traitPool=[
["二次元","四斋蒸鹅心"],["Kpop","五女一是（）（）（）！"],["社恐","社交好可怕，还是一个人待着比较好"],["开朗","喜多~郁代~"],["现充","大家一起搞好关系吧！"],["阴暗b","现充都爆炸吧..."],["文艺b","我想死也想去巴黎"],["吉他手","吉他英雄来也！"],["地下偶像","果然xx酱最可爱了"],["认真","对学习和自己答应的事情比较上心"],["文学少女","今天的风儿有些喧嚣呢"],["傲娇","才、才不是这种性格呢！"],["大小姐","desuwa~"],["运动少女","喜欢运动，体育活动更容易进入生活"],["卷王","东亚小妹能量巨大！"],["社交悍匪","全体目光向我看齐！我宣布个事"],["佛系","随便啦都可以啦"],["熬夜人","你跑不过我你信吗"],["完美主义","希望事情做到最好，也容易给自己压力"],["吃货","小笼包叉烧包奶黄芝麻豆沙包"],["摄影爱好者","咔嚓——"],["手账少女","喜欢整理、规划和记录生活"],["追星族","很容易通过共同偶像认识朋友"],["猫派","看到猫会忍不住停下来"],["社团狂魔","很喜欢参加学校里的各种活动"],["天生卷王","提高一分干掉千人"],["慢热","刚认识别人比较冷淡，熟悉后关系稳定"],["话痨","哎我跟你说"],["低调","不喜欢成为全班焦点"],["好胜心","很在意竞争和输赢"],["玉玉","流泪猫猫头"],["日麻","断幺！1000！"],["交际花","认识不同圈子的人很自然，班里到处都有熟人"],["三无","只要微笑就好了"],["天赋","有些事情上手特别快，别人练很久你却能迅速抓到感觉"],["舞萌","要开始了哦"],["冒失","呜哇又平地摔了"],["直率","直球！"],["刺头","不太喜欢被人安排，遇到不合理的事会直接顶回去"],["中二病","邪王真眼是最强的"],["校园偶像","哦呼~"],
["管人痴","攒钱给最喜欢的主播上舰"],["电波","在天台向创世神大人通话"],["键政","鉴证英雄"],["神人","你牛大了"],["中庸之道","第三名才是最好的"],["动画区up主","我给了其他动画区up主六年的时间"],["小博主","用镜头记录生活"],["小网红","欢迎收看高中生小博主的一天"],["白切黑","我是她朋友~"],["钝感力","不太容易被小事影响"],["冰山","看起来很冷淡，不容易主动亲近别人"],["外冷内热","嘴上不说，实际上很会照顾人"],["coser","喜欢做角色扮演和研究服装细节"],["电竞选手","反应和专注力很强，游戏里很有胜负心"],["漫画家","喜欢画画和把日常画成故事"],["Vtuber","喜欢直播、虚拟角色和网络表达"],["欧皇","偶尔会遇到非常离谱的好运"],["非酋","抽签和随机事件总让你怀疑人生"]
];
const NPCS={
"大小姐":{desc:"傲娇，家境很好。嘴上嫌弃，实际上会照顾身边的人。",tag:"傲娇 / 家境好"},
"班长":{desc:"成绩很好，认真又平易近人，像是大家眼里的完美女孩子。只是她似乎很少谈自己的事。",tag:"认真 / 成绩很好"},
"主人公":{desc:"阳光直率，什么活动都敢第一个报名，精力像用不完一样。",tag:"直率 / 活跃"},
"转校生":{desc:"平时不和人交流，放学也常常一个人走，安静得让人很难判断她在想什么。",tag:"孤高 / 三无感"},
"中二病":{desc:"喜欢梳双马尾，一个人说些听不懂的话，但意外是个非常直率的好孩子。",tag:"中二 / 双马尾 / 直率"},
"学姐":{desc:"和你同初中的学姐，在学校里风生水起，是很多人仰望的偶像。",tag:"学姐 / 校园偶像"},
"同人女":{desc:"经常拿着本子写写画画，在某个平台似乎是非常知名的画手。",tag:"同人 / 画手"},
"体育生":{desc:"似乎总有用不完的精力，总能看到她在操场训练。",tag:"体育生 / 高能量"}
};
let S={name:"",month:9,traits:[],pool:[],stats:{charm:10,intel:10,health:10,money:10},interests:[],npcs:[],npcRelation:{},npcOrder:[],npcIndex:0,used:[],randomDone:false,fixedDone:false,club:null,flags:{},history:[]};
function shuffle(a){return [...a].sort(()=>Math.random()-0.5)}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
function val(id){let n=parseInt(document.getElementById(id).value,10);return Math.max(0,Math.min(40,Number.isFinite(n)?n:0))}
function checkPoints(){let t=val("iCharm")+val("iIntel")+val("iHealth")+val("iMoney");document.getElementById("remain").textContent=40-t;return t===40}
["iCharm","iIntel","iHealth","iMoney"].forEach(id=>document.getElementById(id).addEventListener("input",checkPoints));
function hasTrait(x){return S.traits.some(i=>S.pool[i][0]===x)}
function hasTag(x){return hasTrait(x)||S.interests.includes(x)}
function log(t){let b=document.getElementById("log");b.innerHTML+=`<p>· ${esc(t)}</p>`;b.scrollTop=b.scrollHeight}
function addInterest(x){if(!S.interests.includes(x)){S.interests.push(x);log("获得兴趣标签：【"+x+"】")}}
function update(){["charm","intel","health","money"].forEach(k=>document.getElementById(k).textContent=S.stats[k]);document.getElementById("monthLabel").textContent="高一 · "+S.month+"月";document.getElementById("buffs").innerHTML=[...S.traits.map(i=>S.pool[i][0]),...S.interests].map(x=>`<span class="buff">${esc(x)}</span>`).join("");document.getElementById("npcList").innerHTML=S.npcs.length?S.npcs.map(n=>{let d=NPCS[n],r=S.npcRelation[n]||0;return `<div class="npc"><b>${esc(n)}</b><span>${esc(d.tag)}<br>${esc(d.desc)}<br>关系：${r<2?"刚认识":r<4?"熟悉起来了":"关系不错"}</span></div>`}).join(""):"<div class='notice'>暂时还没有特别认识的人。</div>"}
function renderPool(){S.pool=shuffle(traitPool).slice(0,10);document.getElementById("traitPool").innerHTML=S.pool.map((t,i)=>`<div class="trait" data-i="${i}" onclick="toggleTrait(${i})"><b>${esc(t[0])}</b><span>${esc(t[1])}</span></div>`).join("")}
function toggleTrait(i){let e=document.querySelector(`[data-i="${i}"]`);if(S.traits.includes(i)){S.traits=S.traits.filter(x=>x!==i);e.classList.remove("selected")}else if(S.traits.length<3){S.traits.push(i);e.classList.add("selected")}}
function startGame(){let n=document.getElementById("playerName").value.trim();if(!n)return alert("先给她起个名字吧。");if(S.traits.length!==3)return alert("请从10个特质中选择3个。");if(!checkPoints())return alert("四项属性的总点数必须正好是40。");S.name=n;S.stats={charm:val("iCharm"),intel:val("iIntel"),health:val("iHealth"),money:val("iMoney")};document.getElementById("setup").classList.add("hidden");document.getElementById("game").classList.remove("hidden");document.getElementById("playerNameLabel").textContent=n;document.getElementById("log").innerHTML="";S.npcOrder=shuffle(Object.keys(NPCS));log("你开始了高一上学期的生活。");log("初始特质："+S.traits.map(i=>S.pool[i][0]).join("、"));startMonth()}
function startMonth(){S.randomDone=false;S.fixedDone=false;S.flags.clubOpen=false;document.getElementById("sectionTitle").textContent="本月事件";showRandom(0);update()}
function safeNext(fn){return ()=>{try{fn()}catch(e){console.error(e);log("刚才发生了一点小意外，但生活没有停下来。继续往下走。 ");setTimeout(()=>recover(),0)}}}
function recover(){if(!S.randomDone){showRandom(S.flags.randomSlot||0);return}if(!S.fixedDone){showFixed();return}nextMonth()}
function showChoices(tag,title,text,choices,nextFn){
 const tagEl=document.getElementById("tag"),titleEl=document.getElementById("title"),textEl=document.getElementById("text"),box=document.getElementById("choices");tagEl.textContent=tag;titleEl.textContent=title;textEl.textContent=text;box.innerHTML="";
 choices.forEach((ch)=>{let b=document.createElement("button");b.textContent=ch[0];b.onclick=()=>{if(b.disabled)return;[...box.querySelectorAll("button")].forEach(x=>x.disabled=true);box.innerHTML="";textEl.textContent=ch[1]||"";let fn=ch[2],result;try{if(fn)result=fn()}catch(e){console.error(e);log("这一段出了小故障，已经自动跳过。 ")}
   if(typeof result==="string" && result!=="HANDLED") textEl.textContent=result;
   if(result==="HANDLED")return;
   let n=document.createElement("button");n.className="primary";n.textContent="继续";n.onclick=()=>{n.disabled=true;box.innerHTML="";try{if(nextFn)nextFn();else recover()}catch(e){console.error(e);recover()}};box.appendChild(n);
 };box.appendChild(b)});update()}
function showRandom(slot){S.flags.randomSlot=slot;if(slot===0){let title=["第一次去卢浮宫时，没有什么特别的感觉","食堂最后一排的位置","放学铃响以后","你记住了她的名字"][S.month-9]||"认识一个新同学";let name=S.npcOrder[S.npcIndex++]||shuffle(Object.keys(NPCS))[0];while(S.npcs.includes(name)){name=shuffle(Object.keys(NPCS).filter(x=>!S.npcs.includes(x)))[0]||"班长"}let text=`你在很普通的一天里注意到了${name}。${NPCS[name].desc}\n\n`;let choices=[["主动聊两句","你从眼前的小事开始聊。",()=>{}],["顺着话题聊","你没有刻意热情，只是自然地接住了对方的话。",()=>{}]];showChoices("随机事件 · 认识同学",title,text,choices,()=>finishNPCMeet(name));return}let e=getRandomEvent();if(!e){S.randomDone=true;showFixed();return}S.used.push(e.key);S.history.push(e.title);showChoices("随机事件 · 第2次",e.title,e.text,e.choices,()=>{S.randomDone=true;showFixed();return true})}
function finishNPCMeet(name){if(!S.npcs.includes(name)){S.npcs.push(name);S.npcRelation[name]=1}log("认识了【"+name+"】。");showNPCFollowup(name);return true}
function showNPCFollowup(name){let lines={
"大小姐":["她看你一眼：“我只是觉得一个人吃饭很无聊。”","你发现她说话虽然有点傲，但其实很愿意接话。"],
"班长":[`她很自然地叫出“${S.name}”：“你今天听懂数学老师讲的了吗？”`,`她说话很有耐心，聊完还提醒你明天要交的作业。`],
"主人公":["她远远就招手：“一起去看看社团啊！”","你还没来得及拒绝，她已经开始给你介绍学校里有什么活动。"],
"转校生":["她先只说：“嗯。”你以为聊天结束了，她却过了一会儿问：“你叫什么名字？”","你告诉她名字后，她轻轻点头：“……记住了。”这一次她没有立刻走。"],
"中二病":["她认真地说：“今日结界的稳定度下降了。”然后自己先笑了：“其实我就是喜欢乱说。”","她忽然很直白地问：“所以你觉得我很奇怪吗？”你发现她其实很好沟通。"],
"学姐":["她很快认出你：“我们初中是不是见过？没想到你也来这里了。”","她在学校里确实很受欢迎，但和你说话时没有什么架子。"],
"同人女":["她赶紧把本子合上：“刚才那个你没看到吧？”","确认你没有偷看后，她反而主动问你：“你平时看漫画吗？”"],
"体育生":["她刚训练完，额头还在冒汗：“你也在这边？要不要一起走？”","你发现她一路还能聊个不停，完全不像刚跑完几圈。"]};let l=lines[name]||["她和你简单聊了几句。","你发现对方比第一次见面时自然了一点。"];showChoices("人物互动",name,l[0]+"\n\n"+l[1],[["继续聊","你们又聊了一会儿，关系比刚认识时更自然了。",()=>{S.npcRelation[name]=(S.npcRelation[name]||1)+1}],["先告别","你没有强行延长聊天，但以后见面应该会打招呼。",()=>{}]],()=>{S.flags.randomSlot=1;showRandom(1)})}
function randomKnownNPC(){if(!S.npcs.length)return null;return S.npcs[Math.floor(Math.random()*S.npcs.length)]}
function companion(name,style){if(!name)return"";S.npcRelation[name]=(S.npcRelation[name]||1)+1;let d={"班长":"班长顺手帮你确认了作业安排，聊着聊着又说到班里的小事。","主人公":"主人公直接招手：“走啊，一起去。”","大小姐":"大小姐嘴上嫌弃人多，最后还是跟你一起走了一段。","转校生":"转校生没说很多话，但安静地和你并排走了一会儿。","中二病":"中二病一路讲“结界”，讲到最后却认真问你晚饭吃什么。","学姐":"学姐在人群里认出你，顺便问你最近在学校过得怎么样。","同人女":"同人女把本子合上，跟你聊了几句最近画画和班里的趣事。","体育生":"体育生刚训练完，还是精神十足地跟你一路聊天。"};return d[name]||`${name}也刚好在附近，你们一起走了一段。`}
const baseEvents=[

function getRandomEvent(){let all=[...baseEvents];if(hasTrait("大小姐"))all.push(baseEvents.find(e=>e.key==="home168"));let tags=S.traits.map(i=>S.pool[i][0]);let candidates=[];for(let t of tags){if(!S.used.includes("tag:"+t))candidates.push(makeTagEvent(t))}let usable=all.filter(e=>!S.used.includes(e.key));if(candidates.length&&Math.random()<.7)return candidates[Math.floor(Math.random()*candidates.length)];return usable[Math.floor(Math.random()*usable.length)]||candidates[0]||null}
function makeTagEvent(t){return {key:"tag:"+t,title:tagTitles[t]||("“"+t+"”的一天"),text:(tagTexts[t]||tagOutcomes[t]||"你在放学后的校园里遇到了一件具体的小事。")+"\n\n"+(tagScenes[t]||""),choices:[[tagChoiceA[t],tagResultA(t),()=>tagEffect(t)],[tagChoiceB[t],tagResultB(t),()=>tagEffect(t)]]}}
