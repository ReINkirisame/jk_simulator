<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>女高模拟器</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f2ee;color:#403c38;font-family:"Microsoft YaHei","PingFang SC",sans-serif}
.wrap{max-width:940px;margin:auto;padding:28px 18px 60px}
.card{background:#fff;border:1px solid #e4ddd5;border-radius:12px;padding:20px;margin-top:15px}
h1{margin:0;font-size:30px;letter-spacing:4px;font-weight:600}
h2{font-size:17px;margin:0 0 14px}
.muted{font-size:12px;color:#958c83;margin-top:7px}
.notice{font-size:12px;color:#7f766d;line-height:1.8}
.hidden{display:none!important}
.head{border-bottom:1px solid #ddd5cc;padding-bottom:15px;display:flex;justify-content:space-between;align-items:end}
.month{font-size:14px;color:#756d65}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.stat{border:1px solid #e7e0d8;border-radius:8px;padding:12px}
.stat small{display:block;color:#978e85}.stat b{font-size:23px;display:block;margin-top:4px}
.smalltitle{font-size:12px;color:#8d847b;margin-top:15px}
.buffs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.buff{padding:6px 11px;background:#eee8e1;border-radius:15px;font-size:12px}
.grid{display:grid;grid-template-columns:1.18fr .82fr;gap:15px}
.scene{background:#faf8f5;border-radius:8px;padding:16px;min-height:205px}
.tag{font-size:11px;color:#a18d78}
.scene h3{margin:8px 0;font-size:19px}
.scene p{font-size:13px;line-height:1.9;margin:0;color:#655f59;white-space:pre-line}
.choices{display:grid;gap:9px;margin-top:12px}
button{font-family:inherit;font-size:13px;border:1px solid #d8d0c7;background:#fff;color:#45413d;border-radius:7px;padding:11px 13px;cursor:pointer;text-align:left}
button:hover{background:#f6f1eb}
.primary{background:#4d4945;color:#fff;border-color:#4d4945;text-align:center}
.primary:hover{background:#3d3935}
button:disabled{opacity:.45;cursor:not-allowed}
.log{height:350px;overflow:auto;background:#faf8f5;border-radius:7px;padding:11px;font-size:12px;line-height:1.7}
.log p{margin:0 0 7px}
.rollgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.trait{border:1px solid #ddd5cc;border-radius:8px;padding:12px;cursor:pointer;background:#fff}
.trait.selected{border-color:#5a554f;background:#f1ece6}
.trait b{font-size:14px}.trait span{display:block;font-size:11px;color:#8b827a;margin-top:4px}
.points{font-size:14px;margin:12px 0}.inputs{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.inputs label{font-size:12px;color:#7f766d}.inputs input{width:100%;margin-top:5px;padding:9px;border:1px solid #ddd5cc;border-radius:6px;font-size:16px}
.npc-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.npc{border:1px solid #e5ddd5;border-radius:8px;padding:11px;background:#faf8f5}
.npc b{font-size:13px}.npc span{display:block;font-size:11px;color:#827970;margin-top:4px;line-height:1.6}
@media(max-width:680px){.grid{grid-template-columns:1fr}.stats,.inputs{grid-template-columns:repeat(2,1fr)}.rollgrid,.npc-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">

<section id="setup">
  <div class="card">
    <h1>女高模拟器</h1>
    <h2>先给她起个名字</h2>
    <input id="playerName" type="text" maxlength="12" placeholder="输入名字" style="width:100%;padding:10px;border:1px solid #ddd5cc;border-radius:6px;font-size:14px;margin-bottom:16px">

    <h2>本局抽到的10个特质</h2>
    <div id="traitPool" class="rollgrid"></div>

    <div class="points">可分配点数：<b id="remain">40</b> / 40</div>
    <div class="inputs">
      <label>魅力<input id="iCharm" type="number" min="0" max="40" value="10"></label>
      <label>智力<input id="iIntel" type="number" min="0" max="40" value="10"></label>
      <label>健康<input id="iHealth" type="number" min="0" max="40" value="10"></label>
      <label>家境<input id="iMoney" type="number" min="0" max="40" value="10"></label>
    </div>

    <div style="margin-top:14px">
      <h2>生日</h2>
      <div class="inputs" style="grid-template-columns:1fr 1fr">
        <label>月份<input id="birthdayMonth" type="number" min="1" max="12" value="1"></label>
        <label>日期<input id="birthdayDay" type="number" min="1" max="31" value="1"></label>
      </div>
    </div>

    <div style="margin-top:14px">
      <button class="primary" style="width:100%;text-align:center" onclick="startGame()">开始高中生活</button>
    </div>
  </div>
</section>

<section id="game" class="hidden">
  <div class="head">
    <div><h1>女高模拟器</h1><div class="muted">「<span id="playerNameLabel"></span>」</div></div>
    <div class="month" id="monthLabel"></div>
  </div>

  <div class="card">
    <div class="stats">
      <div class="stat"><small>魅力</small><b id="charm">0</b></div>
      <div class="stat"><small>智力</small><b id="intel">0</b></div>
      <div class="stat"><small>健康</small><b id="health">0</b></div>
      <div class="stat"><small>家境</small><b id="money">0</b></div>
    </div>
    <div class="smalltitle">特质 / 兴趣</div>
    <div class="buffs" id="buffs"></div>
  </div>

  <div class="grid">
    <div class="card">
      <h2 id="sectionTitle">本月事件</h2>
      <div class="scene">
        <div class="tag" id="tag"></div>
        <h3 id="title"></h3>
        <p id="text"></p>
      </div>
      <div class="choices" id="choices"></div>
    </div>

    <div>
      <div class="card">
        <h2>高中生活记录</h2>
        <div class="log" id="log"></div>
        <div class="smalltitle">认识的人</div>
        <div id="npcList" class="npc-grid" style="margin-top:8px"></div>
      </div>
    </div>
  </div>
</section>

<section id="result" class="hidden">
  <div class="card">
    <h1>女高模拟器</h1>
    <h2 style="margin-top:20px">高一结束</h2>
    <div id="resultText" style="font-size:14px;line-height:2"></div>
    <button class="primary" style="width:100%;text-align:center;margin-top:14px" onclick="location.reload()">重新开始 · 再Roll一次</button>
  </div>
</section>

</div>

<script>

"use strict";

/* =========================================================
   《女高模拟器》 v2.0
   单一流程控制：
   月份 -> 固定事件 -> 路线事件 -> 生日 -> 随机事件 -> 下月
   高一上12月：随机事件 -> 生日 -> 固定事件 -> 学期总结
   高一下：固定事件 -> 路线事件 -> 生日 -> 随机事件 -> 下月/暑假
   ========================================================= */

const TRAITS=[
["二次元","四斋蒸鹅心"],["Kpop","五女一是（）（）（）！"],["社恐","社交好可怕，还是一个人待着比较好"],
["开朗","喜多~郁代~"],["现充","大家一起搞好关系吧！"],["阴暗b","现充都爆炸吧..."],["文艺b","我想死也想去巴黎"],
["吉他手","吉他英雄来也！"],["地下偶像","果然xx酱最可爱了"],["认真","对学习和自己答应的事情比较上心"],
["文学少女","今天的风儿有些喧嚣呢"],["傲娇","才、才不是这种性格呢！"],["大小姐","desuwa~"],["运动少女","喜欢运动，体育活动更容易进入生活"],
["卷王","东亚小妹能量巨大！"],["社交悍匪","全体目光向我看齐！我宣布个事"],["佛系","随便啦都可以啦"],["熬夜人","你跑不过我你信吗"],
["完美主义","希望事情做到最好，也容易给自己压力"],["吃货","小笼包叉烧包奶黄芝麻豆沙包"],["摄影爱好者","咔嚓——"],
["手账少女","喜欢整理、规划和记录生活"],["追星族","很容易通过共同偶像认识朋友"],["猫派","看到猫会忍不住停下来"],
["社团狂魔","很喜欢参加学校里的各种活动"],["天生卷王","提高一分干掉千人"],["慢热","刚认识别人比较冷淡，熟悉后关系稳定"],
["话痨","哎我跟你说"],["低调","不喜欢成为全班焦点"],["好胜心","很在意竞争和输赢"],["玉玉","流泪猫猫头"],
["日麻","断幺！1000！"],["交际花","认识不同圈子的人很自然，班里到处都有熟人"],["三无","只要微笑就好了"],
["天赋","有些事情上手特别快，别人练很久你却能迅速抓到感觉"],["舞萌","要开始了哦"],["冒失","呜哇又平地摔了"],
["直率","直球！"],["刺头","凭什么啊！"],["中二病","邪王真眼是最强的"],["校园偶像","哦呼~"],
["管人痴","攒钱给最喜欢的主播上舰"],["电波","在天台向创世神大人通话"],["键政","鉴证英雄"],
["神人","你牛大了"],["中庸之道","第三名才是最好的"],["动画区up主","我给了其他动画区up主六年的时间"],
["小博主","用镜头记录生活"],["小网红","欢迎收看高中生小博主的一天"],["白切黑","我是她朋友~"],["钝感力","不太容易被小事影响"],
["冰山","看起来很冷淡，不容易主动亲近别人"],["外冷内热","嘴上不说，实际上很会照顾人"],
["coser","2.5次元的诱惑"],["电竞选手","我觉得我是"],["漫画家","岸边露伴一动不动"],["Vtuber","用虚拟连接世界"],
["欧皇","偶尔会遇到非常离谱的好运"],["非酋","玄不救非氪不改命"]
];

const NPCS={
"大小姐":{desc:"性格傲娇，嘴上嫌弃，实际上很会照顾人。家里的经济条件明显比周围同学宽裕。",tag:"傲娇 / 家境好"},
"班长":{desc:"成绩很好，行事认真又平易近人，是大家眼里的完美女孩子。她很少主动谈自己的事。",tag:"认真 / 成绩好"},
"主人公":{desc:"阳光直率，什么活动都会第一个报名，精力像用不完一样。",tag:"元气 / 活跃"},
"转校生":{desc:"平时基本不和人交流，放学也常常一个人走，别人很难判断她在想什么。",tag:"孤高 / 神秘"},
"中二病":{desc:"双马尾，总在说一些别人听不懂的话，但聊到普通事情时意外地直接。",tag:"中二 / 直率"},
"学姐":{desc:"和你同初中，在学校里很受欢迎，是很多学妹仰望的对象。",tag:"前辈 / 人气"},
"同人女":{desc:"经常拿着本子写写画画，在某个平台上似乎是很有名的画手。",tag:"同人 / 画手"},
"体育生":{desc:"总能在操场看到她训练，精力旺盛，刚跑完步还能一路聊天。",tag:"体育 / 高能量"}
};

let currentFixedDone=null;

let S={
 name:"",month:9,term:"高一上",phase:"setup",
 traits:[],pool:[],stats:{charm:10,intel:10,health:10,money:10},
 interests:[],club:null,route:null,division:null,
 birthdayMonth:1,birthdayDay:1,npcs:[],npcRelation:{},
 usedRandom:[],usedRoute:{},history:[],flags:{},exam:{}
};

function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function shuffle(a){return [...a].sort(()=>Math.random()-0.5)}
function hasTrait(t){return S.traits.some(i=>S.pool[i]&&S.pool[i][0]===t)}
function hasInterest(t){return S.interests.includes(t)}
function hasTag(t){return hasTrait(t)||hasInterest(t)}
function log(t){const b=$("log");b.innerHTML+=`<p>· ${esc(t)}</p>`;b.scrollTop=b.scrollHeight}
function addInterest(t){if(!S.interests.includes(t)){S.interests.push(t);log("获得兴趣标签：【"+t+"】")}}
function val(id){const n=parseInt($(id).value,10);return Number.isFinite(n)?Math.max(0,Math.min(40,n)):0}
function pointsOK(){return val("iCharm")+val("iIntel")+val("iHealth")+val("iMoney")===40}
["iCharm","iIntel","iHealth","iMoney"].forEach(id=>$(id).addEventListener("input",()=>{
 $("remain").textContent=40-val("iCharm")-val("iIntel")-val("iHealth")-val("iMoney");
}));

function update(){
 $("charm").textContent=S.stats.charm;$("intel").textContent=S.stats.intel;
 $("health").textContent=S.stats.health;$("money").textContent=S.stats.money;
 $("monthLabel").textContent=S.term+(S.month?(" · "+S.month+"月"):"");
 $("buffs").innerHTML=[...S.traits.map(i=>S.pool[i][0]),...S.interests].map(x=>`<span class="buff">${esc(x)}</span>`).join("");
 $("npcList").innerHTML=S.npcs.length?S.npcs.map(n=>{
   const d=NPCS[n],r=S.npcRelation[n]||1;
   return `<div class="npc"><b>${esc(n)}</b><span>${esc(d.tag)}<br>${esc(d.desc)}<br>关系：${r>=5?"关系不错":r>=3?"熟悉起来了":"刚认识"}</span></div>`;
 }).join(""):"<div class='notice'>暂时还没有特别认识的人。</div>";
}

function renderPool(){
 S.pool=shuffle(TRAITS).slice(0,10);S.traits=[];
 $("traitPool").innerHTML=S.pool.map((t,i)=>`<div class="trait" data-i="${i}" onclick="toggleTrait(${i})"><b>${esc(t[0])}</b><span>${esc(t[1])}</span></div>`).join("");
}
function toggleTrait(i){
 const e=document.querySelector(`[data-i="${i}"]`);
 if(S.traits.includes(i)){S.traits=S.traits.filter(x=>x!==i);e.classList.remove("selected");}
 else if(S.traits.length<3){S.traits.push(i);e.classList.add("selected");}
}

function startGame(){
 const n=$("playerName").value.trim();
 if(!n)return alert("先给她起个名字吧。");
 if(S.traits.length!==3)return alert("请从10个特质中选择3个。");
 if(!pointsOK())return alert("四项属性的总点数必须正好是40。");
 S.name=n;S.stats={charm:val("iCharm"),intel:val("iIntel"),health:val("iHealth"),money:val("iMoney")};
 S.birthdayMonth=Math.max(1,Math.min(12,parseInt($("birthdayMonth").value,10)||1));
 S.birthdayDay=Math.max(1,Math.min(31,parseInt($("birthdayDay").value,10)||1));
 S.phase="month";S.month=9;S.term="高一上";S.npcs=[];S.npcRelation={};S.history=[];S.usedRandom=[];S.usedRoute={};S.flags={};S.exam={};
 $("setup").classList.add("hidden");$("result").classList.add("hidden");$("game").classList.remove("hidden");
 $("playerNameLabel").textContent=n;$("log").innerHTML="";
 log("你开始了高一上学期的生活。");log("初始特质："+S.traits.map(i=>S.pool[i][0]).join("、"));
 update();startMonth();
}

function showChoices(tag,title,text,choices,next){
 $("tag").textContent=tag;$("title").textContent=title;$("text").textContent=text;
 const box=$("choices");box.innerHTML="";
 choices.forEach((c)=>{
   const b=document.createElement("button");b.textContent=c[0];
   b.onclick=()=>{
     if(b.disabled)return;
     [...box.querySelectorAll("button")].forEach(x=>x.disabled=true);box.innerHTML="";
     let result="";
     try{if(c[2])result=c[2]();}catch(e){console.error(e);result="这一段出现了小故障，但你还是顺利把事情处理完了。";}
     if(result==="HANDLED")return;
     if(typeof result==="string"&&result) $("text").textContent=result;
     const n=document.createElement("button");n.className="primary";n.textContent="继续";
     n.onclick=()=>{n.disabled=true;box.innerHTML="";if(next)next();};
     box.appendChild(n);update();
   };
   box.appendChild(b);
 });
 update();
}

function finishMonth(){
 if(S.month===12 && S.term==="高一上"){semesterSummary("高一上");return;}
 if(S.month===7 && S.term==="高一下"){semesterSummary("高一下");return;}
 const b=$("choices");b.innerHTML="";
 $("tag").textContent="本月结束";$("title").textContent="这个月的事情告一段落了";
 $("text").textContent="你收好书包，准备进入下个月。";
 const n=document.createElement("button");n.className="primary";n.textContent="进入下个月";
 n.onclick=()=>{n.disabled=true;b.innerHTML="";S.month++;startMonth()};b.appendChild(n);
}

/* ---------- 固定事件 ---------- */
const FIXED={9:[],10:[],11:[],12:[]};
FIXED[9]=[
 {title:"认识新同学",text:"开学第一天，班主任让大家简单自我介绍。陌生的座位、陌生的名字，还有一群以后可能一起度过三年的人。",choices:[
  ["主动记几个名字","你从座位附近开始记名字。",()=>fixedSocial()],
  ["先观察班里的气氛","你先听大家怎么说话，也记住了几个比较有特点的人。",()=>fixedObserve()]
 ]},
 {title:"熟悉校园",text:"接下来的几天，你开始摸清学校：教学楼、食堂、操场、医务室、图书馆，以及放学以后哪里最安静。",choices:[
  ["自己慢慢逛","你按照自己的路线把校园走了一遍。",()=>S.stats.health>=20?"你一路走到后门，连几条平时没人走的小路都记住了。":"你走了一阵就累了，不过也把常用路线记了下来。"],
  ["跟着同学一起逛","有人带着你走了一圈，还顺便讲了几个学校里的小秘密。",()=>fixedSocial()]

  ["进去和老师聊聊","你站在门口叫了一声老师。老师抬头以后，马上问起你现在在哪个班、最近适不适应。",()=> "老师提醒你，别只顾着适应新环境，也要给自己留一点真正喜欢做的事情。"],
  ["和同学在门口等老师","你们没有直接闯进办公室，而是等老师下课。",()=> "老师出来以后认出了你们，笑着说你们一个个都长高了。你们聊了几句高中生活，直到后面还有学生来找老师。"]
 ]},
 {title:"社团纳新",text:"教学楼前的社团摊位几乎摆满了。文学社、动漫社、音乐社、美术社、街舞社、广播站、志愿者协会、篮球社、话剧社、辩论社都在招新。",choices:[
  ["认真比较几个社团","你先看清楚每个社团放学后到底在做什么。",()=>showClub()],
  ["跟着认识的人去看看","有人陪着的时候，陌生的社团摊位也没那么有距离感。",()=>showClub()]
 ]},
 {title:"学生会招新",text:"学生会开始招新。有人想锻炼能力，有人想认识更多人，也有人单纯觉得活动挺有意思。",choices:[
  ["报名试试","你填下报名表，准备看看学生会真正做什么。",()=>fixedSocial()],
  ["先旁听一次活动","你先去旁听，看看这里的工作是不是自己想要的。",()=> "你发现学生会的工作远比海报上写的“锻炼能力”具体：安排、通知、场地和各种临时状况都要处理。"]
 ]}
];
FIXED[10]=[
 {title:"国庆节假期",text:"国庆假期到了。作业当然不会消失，但至少不用每天六点多起床。",choices:[
  ["和朋友一起出去","你联系了最近认识的人，约好在附近见面。",()=>nationalDay()],
  ["留一天完全给自己","你睡到自然醒，慢慢做作业，晚上还留了一点时间给自己的兴趣。",()=> "这一天没有排得很满，你反而重新找回了一点自己的节奏。"]
 ]},

/* ---------- 社团 ---------- */
function showClub(){
 const clubs=[
 ["文学社","文学","喜欢写东西、看书，也会参与校刊。"],["动漫社","二次元","一起看番、聊漫画和游戏。"],["音乐社","音乐","排练、乐器和学校演出。"],
 ["美术社","美术","画画、板报和视觉设计。"],["街舞社","舞蹈","练舞、排节目。"],["广播站","播音","录音、播音和校园广播。"],
 ["志愿者协会","志愿服务","校内外志愿活动。"],["篮球社","篮球","训练和校内比赛。"],["话剧社","话剧","排练、舞台和角色。"],["辩论社","辩论","讨论问题、准备辩题。"]
 ];
 $("tag").textContent="固定事件 · 9月";$("title").textContent="社团纳新";
 $("text").textContent="摊位几乎摆满了教学楼前。你可以加入一个社团，也可以选择归宅部。";
 const box=$("choices");box.innerHTML="";let locked=false;
 clubs.forEach(c=>{
   const b=document.createElement("button");b.innerHTML=`<b>${esc(c[0])}</b>　→　兴趣标签：${esc(c[1])}<br><span style="font-size:11px;color:#8b827a">${esc(c[2])}</span>`;
   b.onclick=()=>{if(locked)return;locked=true;S.club=c[0];addInterest(c[1]);log("加入社团："+c[0]);continueFixedAfterClub()};
   box.appendChild(b);
 });
 const home=document.createElement("button");home.textContent="不加入任何社团 → 归宅部";
 home.onclick=()=>{if(locked)return;locked=true;S.club="归宅部";addInterest("归宅部");log("选择：归宅部");continueFixedAfterClub()};box.appendChild(home);
 return "HANDLED";
}
function continueFixedAfterClub(){
 const idx=FIXED[9].findIndex(e=>e.title==="社团纳新");
 $("choices").innerHTML="";runFixedMonth(idx+1,()=>{
   // 9月固定结束后，统一走路线/生日/随机流程
   runRoute(()=>runBirthday(()=>runRandom(0,finishMonth)));
 });
}

/* ---------- 固定事件执行器 ---------- */
function runFixedMonth(i,done){
 const list=(S.term==="高一上"?FIXED[S.month]:SECOND_FIXED[S.month])||[];
 if(i>=list.length){done();return}
 const e=list[i];
 currentFixedDone=()=>runFixedMonth(i+1,done);
 showChoices("固定事件 · "+S.month+"月",e.title,e.text,e.choices,()=>runFixedMonth(i+1,done));
}

function currentRoute(){return S.route}
function runRoute(done){
 const r=currentRoute();
 if(!r||!ROUTES[r]){done();return}
 const key=S.term+"-"+S.month;
 if(S.usedRoute[key]){done();return}
 const arr=ROUTES[r];
 const available=arr.map((e,i)=>({e,i})).filter(x=>!S.usedRoute[r+"-"+x.i]);
 if(!available.length){done();return}
 const pick=available[Math.floor(Math.random()*available.length)];
 S.usedRoute[key]=true;S.usedRoute[r+"-"+pick.i]=true;
 S.history.push("路线："+pick.e.title);
 showChoices("路线固定事件 · "+S.month+"月",pick.e.title,pick.e.text,pick.e.choices,done);
}

function runBirthday(done){
 if(S.birthdayMonth!==S.month||S.flags["birthday:"+S.term+":"+S.month]){done();return}

 const known=S.npcs.slice(0,5);
 const names=known.length?known.join("、"):"家里人";
 showChoices("特别的一天","生日月",`今天是你的生日。\n\n手机从早上开始陆续亮起来。${names}有人发来生日祝福。原本普通的上学日，突然多了一点不一样的声音。`,[
  ["认真回复收到的祝福","你一条条回过去，也顺手和几个熟悉的人多聊了几句。",()=>{known.forEach(n=>S.npcRelation[n]=(S.npcRelation[n]||1)+1);return "最后一条消息发出去以后，你才发现自己已经在这所学校留下了不少联系。"}],
  ["挑几个人好好回复","你没有逐条写很长，但把真正想说的话认真告诉了最在意的人。",()=>{known.slice(0,2).forEach(n=>S.npcRelation[n]=(S.npcRelation[n]||1)+2);return "你把手机放回桌上时，忽然觉得生日这一天留下的不只是日期。"}]
 ],done);
}

/* ---------- NPC随机事件 ---------- */
function runRandom(slot,done){
  /*
   * NPC随机事件采用“遭遇 -> 人物互动 -> 下一事件”三段式流程。
   * 不在一个 showChoices 的回调里再次套旧的 NPC 流程，避免
   * 旧按钮回调覆盖新按钮，导致“继续”消失或卡死。
   */
  if(typeof done!=="function")done=()=>{};
  if(slot===0){
    const unused=Object.keys(NPCS).filter(n=>!S.npcs.includes(n));
    if(!unused.length){runRandom(1,done);return;}

    const name=shuffle(unused)[0];
    const special={
      "大小姐":"她先问你叫什么。听到名字以后，她本来已经准备离开，却又站住，继续问起你对新学校的感觉。",
      "班长":`她很自然地叫出“${S.name}”，又问你今天有没有听懂数学老师讲的内容。她说话的时候没有一点班干部式的距离感。`,
      "主人公":"她隔着走廊就冲你招手，几句话下来，话题已经从课程跳到社团，又从社团跳到了放学后去哪吃东西。",
      "转校生":"她先只说“嗯”。你本以为对话就到这里了，过了一会儿，她却主动问你叫什么名字。",
      "中二病":"她认真地说了一串关于“结界”的话，最后又突然恢复正常，很直接地问你周末有没有空。",
      "学姐":"她很快认出你，聊起以前初中的事情，又问你现在适应得怎么样。明明隔了一段时间，熟悉感却一下回来了。",
      "同人女":"她赶紧把本子合上，确认你没有看到里面的内容以后，反而主动问你平时看不看漫画。",
      "体育生":"她刚训练完，额头还在冒汗，却已经一路和你聊训练、食堂和最近班里的趣事。"
    };

    // 第一段：只负责完成“认识”。
    showChoices(
      "随机事件 · 认识同学",
      "第一次去卢浮宫时，没有什么特别的感觉",
      `放学以后，你在教学楼外碰见了${name}。\n\n${NPCS[name].desc}\n\n广播站的声音从教学楼里传出来，周围还有同学抱着作业经过。你们都没有立刻离开。`,
      [
        ["主动聊两句",`你从课程、食堂或社团开始聊。${special[name]||""}`,()=>{}],
        ["先从共同话题说起",`你从学校里刚发生的事情聊起。${special[name]||""}`,()=>{}]
      ],
      ()=>{
        // 防止重复写入 NPC。
        if(!S.npcs.includes(name)){
          S.npcs.push(name);
          S.npcRelation[name]=1;
          log("认识了【"+name+"】。");
        }
        update();
        npcInteraction(name,done);
      }
    );
    return;
  }

  const e=pickRandomEvent();
  if(!e){done();return;}
  S.usedRandom.push(e.key);
  S.history.push(e.title);
  showChoices("随机事件 · 第2次",e.title,e.text,e.choices,done);
}

function pickRandomEvent(){
 let candidates=RANDOM_EVENTS.filter(e=>!S.usedRandom.includes(e.key)&&!(e.key==="home168"));
 const traitNames=S.traits.map(i=>S.pool[i][0]).filter(t=>!S.usedRandom.includes("trait:"+t));
 if(traitNames.length&&Math.random()<0.55)candidates.push(...traitNames.map(t=>traitEvent(t)));
 if(hasTrait("大小姐")&&!S.flags.home168Done&&Math.random()<0.12){
   const h=RANDOM_EVENTS.find(e=>e.key==="home168");S.flags.home168Done=true;return h;
 }
 if(!candidates.length)return null;
 return candidates[Math.floor(Math.random()*candidates.length)];
}

function scoreFor(kind){
 let i=S.stats.intel,h=S.stats.health;
 let base=kind==="term2"?500:kind==="term1"?485:kind==="opening"?475:kind==="midterm"?480:470;
 let score=base+i*5.6+(h>=20?8:h<=5?-10:0)+(Math.random()*24-12);
 if(hasTrait("认真"))score+=6;if(hasTrait("卷王")||hasTrait("天生卷王"))score+=5;if(hasTrait("完美主义"))score+=4;
 return Math.max(300,Math.min(680,Math.round(score)));
}

function startExam(name,kind){
 const qs=(kind==="opening")?(DIV_Q[S.division==="理科"?"理科生":"文科生"]):COMMON_Q;
 let idx=0,correct=0;
 function ask(){
   if(idx>=qs.length){
     const score=scoreFor(kind);
     S.exam[kind]=score;
     if(kind==="monthly")S.exam.firstMonthly=score;
     if(kind==="midterm")S.exam.midterm=score;
     if(kind==="term1")S.exam.firstFinal=score;
     if(kind==="opening")S.exam.opening=score;
     if(kind==="term2")S.exam.secondFinal=score;
     log(name+"："+score+"/750。");
     showChoices("考试结果",name+" · 成绩单",`${name}结束。\n\n本次成绩：${score} / 750\n\n满分为750分。`,[
       ["收好成绩单",`你看了一眼成绩，开始想下一阶段的安排。`,()=>{}]
     ],()=>examDone(kind));
     return;
   }
   const q=qs[idx++];
   showChoices("考试 · 第"+idx+"题",name,q[0]+"\n\n"+q[1],[
     ["选择A","你先按自己的判断作答。",()=>{}],
     ["选择B","你换一个角度重新判断。",()=>{}]
   ],ask);
 }
 ask();
 return "HANDLED";
}

}

/* 修正：路线为体育/校园生活时不需要路线事件，避免卡住 */
const oldRunRoute=runRoute;
runRoute=function(done){
  done=typeof done==="function"?done:finishMonth;
  const r=currentRoute();
  if(!r||!ROUTES[r]){done();return;}
  if(r==="竞赛生" && S.term!=="高一上" && S.term!=="高一下"){done();return;}
  if(r==="美术生" && S.term!=="高一上" && S.term!=="高一下"){done();return;}
  if((r==="文科生"||r==="理科生") && (S.term!=="高一下"||S.month<3||S.month>7)){done();return;}
  const key=S.term+"-"+S.month+"-"+r;
  if(S.usedRoute[key]){done();return;}
  const arr=Array.isArray(ROUTES[r])?ROUTES[r]:[];
  const available=arr.filter((e,i)=>e&&!S.usedRoute[r+"-"+i]);
  if(!available.length){done();return;}
  const pick=available[Math.floor(Math.random()*available.length)];
  const idx=arr.indexOf(pick);
  S.usedRoute[key]=true;S.usedRoute[r+"-"+idx]=true;
  S.history.push("路线："+pick.title);
  showChoices("路线固定事件 · "+S.month+"月",pick.title,pick.text,pick.choices,done);
};

/* ---------- NPC / 互动流程稳定性修复 ---------- */
let uiFlowToken=0;

showChoices=function(tag,title,text,choices,next){
  const box=$("choices");
  $("tag").textContent=tag||"";
  $("title").textContent=title||"";
  $("text").textContent=text||"";
  box.innerHTML="";

  const list=Array.isArray(choices)?choices:[];
  if(!list.length){
    const n=document.createElement("button");
    n.className="primary";n.type="button";n.textContent="继续";
    n.onclick=()=>{n.disabled=true;box.innerHTML="";safeNext(next)};
    box.appendChild(n);update();return;
  }

  let locked=false;
  list.forEach((c)=>{
    const b=document.createElement("button");
    b.type="button";b.textContent=c&&c[0]?c[0]:"继续";
    b.onclick=()=>{
      if(locked)return;
      locked=true;
      [...box.querySelectorAll("button")].forEach(x=>x.disabled=true);
      box.innerHTML="";
      let result="";
      try{
        if(c&&typeof c[2]==="function")result=c[2]();
      }catch(e){
        console.error("事件选项执行失败：",e);
        result="这一段出现了小故障，但你的选择已经生效。";
      }
      if(result==="HANDLED")return;
      if(typeof result==="string"&&result)$("text").textContent=result;
      const n=document.createElement("button");
      n.className="primary";n.type="button";n.textContent="继续";
      n.onclick=()=>{if(n.disabled)return;n.disabled=true;box.innerHTML="";safeNext(next)};
      box.appendChild(n);
      update();
    };
    box.appendChild(b);
  });
  update();
};

function safeNext(next){
  try{
    if(typeof next==="function")next();
    else finishMonth();
  }catch(e){
    console.error("事件继续流程失败：",e);
    const box=$("choices");box.innerHTML="";
    $("tag").textContent="继续游戏";
    $("title").textContent="事件已经结束";
    $("text").textContent="刚才的事件已经记录下来，现在继续高中生活。";
    const n=document.createElement("button");n.className="primary";n.type="button";n.textContent="继续游戏";
    n.onclick=()=>{n.disabled=true;box.innerHTML="";try{finishMonth()}catch(_){location.reload()}};
    box.appendChild(n);
  }
}

runRandom=function(slot,done){
  if(typeof done!=="function")done=()=>{};

  if(slot===0){
    const unused=Object.keys(NPCS).filter(n=>!S.npcs.includes(n));
    if(!unused.length){runRandom(1,done);return;}

    const name=unused[Math.floor(Math.random()*unused.length)];
    const intro={
      "大小姐":"她抱着手站在你旁边，嘴上还是一副“只是顺便聊聊”的样子。",
      "班长":"她把手里的资料整理好，转过来认真听你说。",
      "主人公":"她完全没有陌生人的拘谨，像是已经认识你一阵子似的。",
      "转校生":"她没有看你太久，但也没有像刚才那样马上离开。",
      "中二病":"她双马尾随着动作轻轻晃了一下，表情依旧认真得像是在讨论什么大事。",
      "学姐":"她站在校门边，和你聊起以前学校里那些现在想起来有点好笑的事情。",
      "同人女":"她把画本抱在怀里，终于没有刚见面时那么戒备。",
      "体育生":"她刚结束训练，整个人还是一副随时还能再跑两圈的样子。"
    };
    const talk={
      "大小姐":[
        ["问问她平时都去哪吃饭","你顺着她的话问起学校附近的店。她嘴上说“也就那几家”，却认真告诉你哪一家午休不用排太久。",2],
        ["聊聊刚才的社团","你们从社团摊位聊到各自真正感兴趣的东西。她一开始还装得很不在意，后来明显聊得比刚才多。",1]
      ],
      "班长":[
        ["问她最近在忙什么","你问起她最近是不是总在帮老师整理东西。她笑着说只是顺手，但说到一半又开始聊起自己真正喜欢的课程。",2],
        ["聊聊班里的同学","你们把刚认识的几个人挨个聊了一遍。她记名字记得很快，你也顺便知道了几个班里的小圈子。",1]
      ],
      "主人公":[
        ["问她放学后准备干什么","她马上报出一串计划：社团、买饮料、去操场，最后还问你要不要一起。",2],
        ["继续聊社团","她兴奋地把自己感兴趣的活动全说了一遍，连下周的安排都已经想好了。",1]
      ],
      "转校生":[
        ["问她以前在哪里上学","她沉默了一会儿，只告诉你一个很普通的答案。你没有继续追问，她反而主动聊起现在学校的走廊。",2],
        ["和她一起走一段","你们并排走过教学楼，没有一直说话。快到楼梯口时，她忽然问你明天是不是也走这条路。",2]
      ],
      "中二病":[
        ["认真听她讲“结界”","她说得一本正经，你没有打断。讲到最后她自己先笑了，又开始和你讨论食堂今天的菜。",2],
        ["直接问她周末有没有空","她愣了一下，然后很爽快地告诉你周末的安排，还反问你是不是有什么活动。",1]
      ],
      "学姐":[
        ["问问初中的近况","她讲起以前的老师和学妹，最后还问你有没有遇到以前认识的人。",2],
        ["请她推荐学校里值得去的地方","她想了一会儿，给你列了几个学姐们常去的地方，还提醒你哪几个时间段最拥挤。",1]
      ],
      "同人女":[
        ["问她最近在画什么","她先警惕地看你一眼，确认你是真的感兴趣后，才翻开本子给你看其中一页。",2],
        ["聊聊喜欢的作品","你们从一部作品聊到另一部作品，她原本很小声，后来越说越兴奋。",1]
      ],
      "体育生":[
        ["问她最近在练什么","她马上开始讲训练安排，还顺手给你比划动作。",2],
        ["约下次一起去操场","她说可以，但提醒你先别高估自己的体力。",1]
      ]
    };

    showChoices(
      "随机事件 · 认识同学",
      "第一次去卢浮宫时，没有什么特别的感觉",
      `放学以后，你在教学楼外碰见了${name}。\n\n${NPCS[name].desc}\n\n${intro[name]||""}\n\n广播站的声音从教学楼里传出来，周围还有同学抱着作业经过。`,
      [
        ["主动聊两句","你从课程、食堂或社团开始聊。",()=>{}],
        ["先从共同话题说起","你从学校里刚发生的事情聊起。",()=>{}]
      ],
      ()=>{
        if(!S.npcs.includes(name)){
          S.npcs.push(name);
          S.npcRelation[name]=1;
          log("认识了【"+name+"】。");
        }
        update();

        const opts=talk[name]||[
          ["继续聊刚才的话题","你们又聊了一会儿，原本陌生的气氛慢慢松下来。",1],
          ["聊聊放学后的安排","你们说起社团、作业和回家的路线，话题自然多了起来。",1]
        ];

        showChoices(
          "人物互动",
          name,
          `${intro[name]||"你们站在走廊边，话题一点点从刚才的偶遇变成了真正的聊天。"}\n\n你们已经不再只是刚刚见过一面的关系。`,
          opts.map(o=>[
            o[0],o[1],
            ()=>{
              S.npcRelation[name]=(S.npcRelation[name]||1)+o[2];
              log(`和【${name}】聊了一会儿，关系有所加深。`);
              return o[1];
            }
          ]),
          done
        );
      }
    );
    return;
  }

  const e=pickRandomEvent();
  if(!e){done();return;}
  S.usedRandom.push(e.key);
  S.history.push(e.title);
  showChoices("随机事件 · 第2次",e.title,e.text,e.choices,done);
};

/* 初始化 */
renderPool();update();

</script>
